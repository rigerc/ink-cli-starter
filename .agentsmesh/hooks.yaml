# yaml-language-server: $schema=https://unpkg.com/agentsmesh@0.42.0/schemas/hooks.json
# Regenerate tool configuration when a session starts.
SessionStart:
  - matcher: '*'
    type: command
    command: agentsmesh generate
    timeout: 60

