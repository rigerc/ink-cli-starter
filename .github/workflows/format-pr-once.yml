name: Format new updater scripts once

on:
  push:
    branches: [automation/adopt-agent-documentation-updaters]
    paths:
      - '.github/workflows/format-pr-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'rigerc/ink-cli-starter'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format using repository tooling
        run: vp check --fix
      - name: Commit formatted updater scripts
        shell: bash
        run: |
          git diff --check
          git add scripts/update-agents-md.mjs scripts/sync-skill.mjs
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format agent updater scripts'
          git push origin HEAD:automation/adopt-agent-documentation-updaters
