name: Changeset status

# Reminds contributors to add a changeset. Only active once a downstream repo sets RELEASE_ENABLED=true.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  status:
    if: >-
      github.repository != 'rigerc/ink-cli-starter' &&
      vars.RELEASE_ENABLED == 'true' &&
      github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Changeset status
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx changeset status --since="origin/$BASE_REF"
