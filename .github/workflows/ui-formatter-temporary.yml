name: Temporary UI format check
on:
  push:
    branches:
      - refactor/composable-ui-runtime

permissions:
  contents: read

jobs:
  formatted-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format and print proposed source changes
        shell: bash
        run: |
          node_modules/.bin/vp check --fix || true
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const changed = execFileSync('git', ['diff', '--name-only'], {encoding: 'utf8'});
          for (const path of changed.trim().split('\n').filter(Boolean)) {
            console.log('FMT_FILE=' + JSON.stringify({path, content: readFileSync(path, 'utf8')}));
          }
          NODE
