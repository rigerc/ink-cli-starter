name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the packaged CLI
        shell: bash
        run: |
          node dist/cli.js tasks add "CI smoke" --data "$RUNNER_TEMP/ink-tasks.json"
          node dist/cli.js tasks list --json --data "$RUNNER_TEMP/ink-tasks.json"
