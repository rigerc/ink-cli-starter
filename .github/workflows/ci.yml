name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, formatting and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck

  tests:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install completion shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - name: Tests and coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run test:coverage
      - name: Tests
        if: matrix.os != 'ubuntu-latest' || matrix.node != '24'
        run: npm test
      - run: npm run build
      - run: node dist/cli.js --help
      - run: node dist/cli.js --plain
      - run: node dist/cli.js doctor --json
      - run: node dist/cli.js config list --json
      - run: node dist/cli.js completion bash
      - name: Check packed command
        shell: bash
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          PACKAGE_TGZ=$(node -p "require(process.env.RUNNER_TEMP + '/pack.json')[0].filename")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          npm install --prefix "$RUNNER_TEMP/cli-smoke" "$RUNNER_TEMP/$PACKAGE_TGZ"
          node "$RUNNER_TEMP/cli-smoke/node_modules/$PACKAGE_NAME/dist/cli.js" --help
          node "$RUNNER_TEMP/cli-smoke/node_modules/$PACKAGE_NAME/dist/cli.js" doctor --json
      - uses: actions/upload-artifact@v6
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        with:
          name: coverage
          path: coverage/
