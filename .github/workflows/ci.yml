name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel outdated PR runs when newer commits are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, formatting and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify starter agent skill accuracy
        if: github.repository == 'rigerc/ink-cli-starter'
        run: |
          node --test tests/skill-accuracy.test.mjs
          node scripts/check-skill-accuracy.mjs
      - run: npm run check
      - run: npm run typecheck

  tests:
    name: ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # node-pty 1.1.0 publishes macOS spawn-helper without the executable bit.
      - name: Restore node-pty macOS spawn-helper permissions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -d node_modules/node-pty/prebuilds ]; then
            find node_modules/node-pty/prebuilds -type f -name spawn-helper -exec chmod +x {} +
          fi
      - name: Install completion shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - name: Tests and coverage
        if: runner.os == 'Linux'
        env:
          # Keep the native PTY suite required here; other runners treat it as optional.
          REQUIRE_PTY: '1'
        run: npm run test:coverage
      - name: Tests
        if: runner.os != 'Linux'
        run: npm test
      - run: npm run build
      - run: node dist/cli.js --help
      - run: node dist/cli.js --plain
      - run: node dist/cli.js doctor --json
      - run: node dist/cli.js config list --json
      - run: node dist/cli.js completion bash
      - name: Check packed command
        shell: bash
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          PACKAGE_TGZ=$(node -p "require(process.env.RUNNER_TEMP + '/pack.json')[0].filename")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          npm install --prefix "$RUNNER_TEMP/cli-smoke" "$RUNNER_TEMP/$PACKAGE_TGZ"
          node "$RUNNER_TEMP/cli-smoke/node_modules/$PACKAGE_NAME/dist/cli.js" --help
          node "$RUNNER_TEMP/cli-smoke/node_modules/$PACKAGE_NAME/dist/cli.js" doctor --json
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: coverage
          path: coverage/
