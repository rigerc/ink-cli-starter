name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --help
      - run: node dist/cli.js --plain
      - run: node dist/cli.js doctor --json
      - name: Check packed command
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/cli-smoke"
          npm install --prefix "$RUNNER_TEMP/cli-smoke" "$RUNNER_TEMP/ink-kit-0.1.0.tgz"
          "$RUNNER_TEMP/cli-smoke/node_modules/.bin/ink-kit" --help
