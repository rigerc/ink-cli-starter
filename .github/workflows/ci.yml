name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify vendored source integrity
        run: node scripts/check-vendored.mjs
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck, tests and build
        run: npm run check
      - name: Smoke test commands and terminal fallback
        run: |
          node build/cli.js --help
          node build/cli.js doctor
          NO_COLOR=1 NO_UNICODE=1 CI=true node build/cli.js demo --theme mono
