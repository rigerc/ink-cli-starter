name: Sync upstream template

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  template-sync:
    # This is the source template; sync only in repositories created from it.
    if: github.repository != 'rigerc/ink-cli-starter'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TEMPLATE_SYNC_TARGET_TOKEN || github.token }}
          persist-credentials: false

      - name: Sync upstream template and open pull request
        uses: AndreasAugustin/actions-template-sync@v2
        with:
          source_repo_path: rigerc/ink-cli-starter
          target_gh_token: ${{ secrets.TEMPLATE_SYNC_TARGET_TOKEN || github.token }}
          pr_title: 'chore: sync changes from ink-cli-starter'
