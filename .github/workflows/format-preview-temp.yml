name: Temporary initializer format preview

on:
  push:
    branches: [feature/project-initializer]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vp check --fix
      - name: Print formatted source for review
        run: |
          node -e 'const fs = require("node:fs"); for (const path of ["scripts/init-project.mjs", "tests/init-project.test.ts"]) console.log("AUTOFORMAT " + JSON.stringify({path, content: fs.readFileSync(path, "utf8")}));'
