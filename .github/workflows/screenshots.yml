name: Screenshots and recordings

on:
  workflow_dispatch:
    inputs:
      screen:
        description: Screen to record
        default: home
        type: string
      theme:
        description: Theme to record
        default: dark
        type: choice
        options: [dark, light, contrast, mono]
      columns:
        description: Recording width in columns (40–240)
        default: '100'
        type: string
      tape:
        description: Interaction tape relative to the checkout
        default: scripts/tapes/workflow.tape
        type: string

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: charmbracelet/vhs-action@v2
        with:
          version: v0.12.1
          install-fonts: true
      - run: npm run typecheck
      - run: npm test
      - name: Capture all registered screens
        run: |
          mkdir -p assets/screenshots
          rm -f assets/screenshots/*.png
          npm run screenshot -- --theme dark --columns 100 --output-dir assets/screenshots
      - name: Record interactive demo
        env:
          CAPTURE_SCREEN: ${{ inputs.screen || 'home' }}
          CAPTURE_THEME: ${{ inputs.theme || 'dark' }}
          CAPTURE_COLUMNS: ${{ inputs.columns || '100' }}
          CAPTURE_TAPE: ${{ inputs.tape || 'scripts/tapes/workflow.tape' }}
        run: |
          npm run record -- --screen "$CAPTURE_SCREEN" --theme "$CAPTURE_THEME" --columns "$CAPTURE_COLUMNS" --tape "$CAPTURE_TAPE" --format mp4
          cp "screenshots/${CAPTURE_SCREEN}-${CAPTURE_THEME}-${CAPTURE_COLUMNS}-video.mp4" assets/demo.mp4
          test -s assets/demo.mp4
      - name: Upload captures for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-captures
          path: |
            assets/screenshots/*.png
            assets/demo.mp4
            assets/screenshots/tapes/
            screenshots/tapes/
          if-no-files-found: error
          retention-days: 14
      - name: Commit refreshed assets on main
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':(glob)assets/screenshots/*.png' assets/demo.mp4
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh terminal captures [skip ci]"
            git push
          fi
