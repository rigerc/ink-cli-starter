name: Update starter agent skill reference

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
      - '.agents/skills/ink-cli-starter/**'
      - '.claude/skills/ink-cli-starter/**'
      - 'scripts/sync-skill.mjs'
      - 'scripts/check-skill-accuracy.mjs'
      - '.github/workflows/update-skill.yml'
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-starter-agent-skill
  cancel-in-progress: false

jobs:
  sync:
    # Downstream applications own their agent instructions and must opt in separately.
    if: github.repository == 'rigerc/ink-cli-starter' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Regenerate factual skill reference in both agent locations
        run: npm run update:skill
      - name: Verify deterministic generated references
        run: npm run check:skill
      - name: Audit human-maintained skill guidance
        id: audit
        continue-on-error: true
        run: node scripts/check-skill-accuracy.mjs
      - name: Open or update generated-reference PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SKILL_AUTOMATION_TOKEN || github.token }}
          branch: automation/update-ink-cli-starter-skill
          base: main
          delete-branch: true
          add-paths: |
            .agents/skills/ink-cli-starter/references/generated-api.md
            .claude/skills/ink-cli-starter/references/generated-api.md
          commit-message: 'docs: refresh generated starter skill reference'
          title: 'docs: refresh generated starter skill reference'
          body: |
            Automated update of the source-derived Ink CLI starter skill reference.

            - Refreshes command extension exports and available source modules.
            - Updates package, runtime dependencies and npm script metadata.
            - Preserves human-authored skill guidance in both agent locations.

            **Authored guidance audit:** ${{ steps.audit.outcome }}.
            A failed audit requires manual review of the authored SKILL.md copies.

            Generated by the Update starter agent skill reference workflow.
